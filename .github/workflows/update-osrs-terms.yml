name: Update OSRS terms

on:
  schedule:
    - cron: '0 6 1 * *' # monthly, 1st at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Resolve latest runelite-api release
        id: resolve
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://repo.runelite.net/net/runelite/runelite-api/maven-metadata.xml \
            | grep -oP '(?<=<release>).*(?=</release>)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download runelite-api jar
        run: |
          set -euo pipefail
          curl -fsSL -o runelite-api.jar \
            "https://repo.runelite.net/net/runelite/runelite-api/${{ steps.resolve.outputs.version }}/runelite-api-${{ steps.resolve.outputs.version }}.jar"

      - name: Extract quest names
        run: |
          set -euo pipefail
          javac -cp runelite-api.jar scripts/update-osrs-terms/ExtractQuestNames.java -d build/quest-extract
          java -cp build/quest-extract:runelite-api.jar ExtractQuestNames > quest-names.txt

          # Sanity check - a near-empty result means extraction broke (API change, bad jar,
          # etc.), not that OSRS actually lost most of its quests. Fail loudly instead of
          # silently proposing to wipe the dictionary's quest-derived terms.
          COUNT=$(wc -l < quest-names.txt)
          if [ "$COUNT" -lt 100 ]; then
            echo "::error::only extracted $COUNT quest names, expected 100+ - aborting"
            exit 1
          fi

      - name: Merge new terms into osrs-terms.txt
        id: merge
        run: |
          set -euo pipefail
          python3 scripts/update-osrs-terms/merge_new_terms.py quest-names.txt > new-words.txt
          if [ -s new-words.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose PR body
        if: steps.merge.outputs.changed == 'true'
        run: |
          {
            echo "New words found in RuneLite's \`net.runelite.api.Quest\` display names that"
            echo "aren't yet covered by the bundled dictionaries (ENABLE1, the frequency list,"
            echo "contractions, or the existing \`osrs-terms.txt\`):"
            echo ""
            echo '```'
            cat new-words.txt
            echo '```'
            echo ""
            echo "Generated by the \`update-osrs-terms\` workflow - review before merging."
          } > pr-body.md

      - name: Open pull request
        if: steps.merge.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: add new OSRS quest-name terms to dictionary"
          title: "Add new OSRS quest-name terms to dictionary"
          body-path: pr-body.md
          branch: update-osrs-terms
          add-paths: src/main/resources/com/chatspellcheck/osrs-terms.txt
