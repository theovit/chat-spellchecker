name: Update frequency word list

on:
  schedule:
    - cron: '0 6 2 * *' # monthly, 2nd at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest frequency list and diff against the bundled copy
        id: fetch
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt" \
            | awk '{print $1}' > new-word-frequency-en.txt

          # Sanity check - hermitdave/FrequencyWords' en_50k.txt is ~50k lines. A short/empty
          # result means the fetch broke somehow, not that the list actually shrank - fail
          # loudly instead of silently degrading suggestion quality.
          COUNT=$(wc -l < new-word-frequency-en.txt)
          if [ "$COUNT" -lt 40000 ]; then
            echo "::error::fetched frequency list has only $COUNT lines, expected ~50000 - aborting"
            exit 1
          fi

          if diff -q new-word-frequency-en.txt src/main/resources/com/chatspellcheck/word-frequency-en.txt > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            mv new-word-frequency-en.txt src/main/resources/com/chatspellcheck/word-frequency-en.txt
          fi

      - name: Open pull request
        if: steps.fetch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update bundled word-frequency list"
          title: "Update bundled word-frequency list"
          body: |
            `hermitdave/FrequencyWords`' `en_50k.txt` changed upstream - this updates our
            bundled copy (word column only, no counts). Review the diff before merging;
            frequency-rank ordering for spellcheck suggestions depends on this file's line
            order, so an upstream reshuffle could shift which suggestion wins ties.
          branch: update-frequency-list
          add-paths: src/main/resources/com/chatspellcheck/word-frequency-en.txt
